<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Problems · LCE</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <!-- Auth gate -->
  <div id="auth-gate" class="auth-gate" hidden>
    <div class="auth-stage">
      <div class="auth-mark">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M3 9.5h18M8 9.5v10.5" stroke="currentColor" stroke-width="1.6"/>
        </svg>
      </div>
      <h1 class="auth-headline">Sign in to view your problems</h1>
      <p class="auth-sub">Your tracked work is privately synced to your Google account.</p>
      <button id="auth-btn" class="auth-btn" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        <span id="auth-label">Continue with Google</span>
      </button>
      <div id="auth-error" class="auth-err" hidden></div>
    </div>
  </div>

  <div class="app">
    <header class="toolbar">
      <div class="toolbar-left">
        <div class="brand">
          <svg class="brand-icon" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
            <rect x="2.5" y="3.5" width="15" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
            <path d="M2.5 8h15M7 8v8.5" stroke="currentColor" stroke-width="1.4"/>
          </svg>
          <span class="brand-text">Problems</span>
        </div>
        <span class="count-pill" id="count">0 / 0</span>
      </div>

      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m11 11 3 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input id="search" placeholder="Search title, number, slug" autocomplete="off" spellcheck="false">
        <kbd class="kbd">⌘K</kbd>
      </div>

      <div class="toolbar-right">
        <button id="toggle-filters" class="btn" type="button">
          <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M2 4h12M4 8h8M6 12h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          Filter <span class="badge" id="filter-count" hidden>0</span>
        </button>
        <button id="toggle-density" class="btn" type="button">
          <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span id="density-label">Compact</span>
        </button>
      </div>
    </header>

    <aside class="filters" id="filters" hidden></aside>

    <main class="table-wrap" id="table-wrap">
      <table class="problems-table">
        <thead>
          <tr>
            <th data-sort="number" class="col-num">№</th>
            <th data-sort="title">Title</th>
            <th data-sort="difficulty">Difficulty</th>
            <th>Topics</th>
            <th data-sort="status">Status</th>
            <th data-sort="latestConfidence" class="col-conf">Confidence</th>
            <th class="col-notes">Notes</th>
            <th data-sort="firstSolved" class="col-date">First solved</th>
            <th data-sort="lastReviewed" class="col-date">Last reviewed</th>
            <th data-sort="nextDue" class="col-date">Next due</th>
            <th data-sort="srsIntervalDays" class="col-int">Interval</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </main>

    <footer class="status-bar">
      <div class="status-left" id="status-left"></div>
      <div class="status-right" id="status-right"></div>
    </footer>
  </div>

  <script type="module" src="viewer.js"></script>
</body>
</html>
